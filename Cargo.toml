[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
memmap2 = "0.9"
hashbrown = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arrow = { version = "53", default-features = false }
parquet = { version = "53", default-features = false, features = ["arrow"] }
glob = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
